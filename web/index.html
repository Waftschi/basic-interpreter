<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeScript BASIC</title>
<style>
  /* UNSCII pixel glyphs (PETSCII suits, lines and blocks), used by the invaders games; scaled to match the monospace grid */
  @font-face {
    font-family: "Unscii"; src: url("fonts/unscii-8.ttf") format("truetype");
    unicode-range: U+2660, U+2663, U+2665-2666, U+2500, U+2502, U+250C, U+2510, U+2514, U+2518, U+2534, U+2571-2572, U+25CB, U+25CF, U+2596, U+2592, U+2588;
    size-adjust: 60%;
  }
  :root { --fg: #33ff66; --dim: #1a8f3a; --bg: #020a04; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  #crt {
    box-sizing: border-box; width: 100vw; height: 100vh; padding: 28px 36px;
    background: radial-gradient(ellipse at center, #06200c 0%, var(--bg) 75%, #000 100%);
    overflow: hidden; position: relative;
  }
  /* scanlines + vignette */
  #crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  #screen {
    height: 100%; overflow-y: auto; margin: 0; outline: none;
    font: 20px/1.25 Unscii, "Courier New", Menlo, Consolas, monospace;
    color: var(--fg); text-shadow: 0 0 6px rgba(51,255,102,.65), 0 0 14px rgba(51,255,102,.25);
    white-space: pre-wrap; word-break: break-all; scrollbar-width: none;
  }
  #screen::-webkit-scrollbar { display: none; }
  #cursor {
    background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 8px var(--fg);
    animation: blink 1.06s steps(1) infinite;
  }
  #screen.running #cursor { display: none; }
  @keyframes blink { 50%, 100% { background: transparent; color: var(--fg); box-shadow: none; } }
  ::selection { background: var(--fg); color: #000; text-shadow: none; }
</style>
</head>
<body>
<div id="crt"><pre id="screen" tabindex="0"><span id="out"></span><span id="line"></span><span id="cursor"> </span><span id="after"></span></pre></div>
<script type="module" src="../dist/src/web.js"></script>
</body>
</html>
